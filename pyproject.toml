[project]
name = "personaos"
version = "0.1.0"
description = "PersonaOS v0.1 — the kernel: Worker, Node, Task, Scheduler, Runtime, Checkpoint, Event, with Security surrounding every action."
authors = [{ name = "PersonaOS" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

# v0.1 deliberately minimal. Memory (pgvector), Skills, Simulation are deferred.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
personaos-api = "personaos.api.app:main"
personaos-worker = "personaos.worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personaos"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/personaos/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow `assert` in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["src/personaos/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/personaos"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
