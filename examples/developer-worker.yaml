# Developer worker — example seed profile (not the runtime schema).
# The seed script splits this into:
#   - workers       (id, name, role, description, status, runtime, max_concurrent_tasks, personality)
#   - worker_skills (one row per skill)
# Workers.capabilities and workers.permissions are populated from the lists below.

id: worker-developer-001
name: Senior Developer

role: developer
description: Implementation, code review, and debugging

status: idle
runtime: openclaw
max_concurrent_tasks: 2

personality:
  style: methodical
  autonomy: medium

# -> worker_skills
skills:
  - python
  - typescript
  - postgres
  - docker

# -> workers.capabilities (jsonb)
capabilities:
  - terminal
  - editor
  - git
  - test-runner

# -> workers.permissions (jsonb)
permissions:
  - repo.read
  - repo.write
  - ci-runners

# memory_id is null in v0.1; populated when Memory lands (Phase 2, ADR 0007).
memory_id: null
