# QA worker — example seed profile (not the runtime schema).
# The seed script splits this into:
#   - workers       (id, name, role, description, status, runtime, max_concurrent_tasks, personality)
#   - worker_skills (one row per skill)
# Workers.capabilities and workers.permissions are populated from the lists below.

id: worker-qa-001
name: QA Engineer

role: qa
description: Test design, regression checks, release verification

status: idle
runtime: openclaw
max_concurrent_tasks: 2

personality:
  style: thorough
  autonomy: low

# -> worker_skills
skills:
  - test-design
  - selenium
  - regression
  - release-verification

# -> workers.capabilities (jsonb)
capabilities:
  - terminal
  - browser
  - test-runner
  - bug-tracker

# -> workers.permissions (jsonb)
permissions:
  - staging.read
  - test-environments

# memory_id is null in v0.1; populated when Memory lands (Phase 2, ADR 0007).
memory_id: null
