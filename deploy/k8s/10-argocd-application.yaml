apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personaos
  namespace: argocd
  labels:
    app.kubernetes.io/name: personaos
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cylyl/PersonaOS.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: personaos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
