apiVersion: v1
kind: ConfigMap
metadata:
  name: personaos-config
  namespace: personaos
  labels:
    app.kubernetes.io/name: personaos
    site: site2
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  ENABLE_NODE_SUPERVISION: "true"
  NODE_SUPERVISION_INTERVAL_SECONDS: "10.0"
  NODE_HEARTBEAT_TIMEOUT_SECONDS: "60.0"
  TASK_LEASE_TTL_SECONDS: "300"
  MEMORY_ADAPTER: "in_memory"
  MEM0_BASE_URL: "https://api.mem0.ai/v1"
  MEMORY_MIN_CONFIDENCE: "0.0"
  WORKER_POLL_INTERVAL_SECONDS: "2.0"
  RUNTIME_ADAPTER: "openclaw"
  POLICIES_DIR: "/app/policies"
  PROFILES_DIR: "/app/profiles"
