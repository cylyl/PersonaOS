apiVersion: apps/v1
kind: Deployment
metadata:
  name: personaos-worker
  namespace: personaos
  labels:
    app.kubernetes.io/name: personaos-worker
    app.kubernetes.io/component: worker
    site: site2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: personaos-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personaos-worker
        app.kubernetes.io/component: worker
        site: site2
    spec:
      nodeSelector:
        site: site2
      containers:
        - name: worker
          image: 192.168.1.239:5000/personaos:latest
          imagePullPolicy: Always
          command:
            - "sh"
            - "-c"
            - "exec personaos-worker --worker-id worker-${POD_NAME} --node-id node-${POD_NAME}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: personaos-config
            - secretRef:
                name: personaos-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
