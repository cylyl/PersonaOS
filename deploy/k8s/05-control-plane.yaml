apiVersion: apps/v1
kind: Deployment
metadata:
  name: personaos-api
  namespace: personaos
  labels:
    app.kubernetes.io/name: personaos-api
    app.kubernetes.io/component: control-plane
    site: site2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: personaos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personaos-api
        app.kubernetes.io/component: control-plane
        site: site2
    spec:
      nodeSelector:
        site: site2
      initContainers:
        - name: run-migrations
          image: 192.168.1.239:5000/personaos:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: personaos-config
            - secretRef:
                name: personaos-secrets
      containers:
        - name: control-plane
          image: 192.168.1.239:5000/personaos:latest
          imagePullPolicy: Always
          command: ["personaos-api"]
          envFrom:
            - configMapRef:
                name: personaos-config
            - secretRef:
                name: personaos-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: personaos-api
  namespace: personaos
  labels:
    app.kubernetes.io/name: personaos-api
    app.kubernetes.io/component: control-plane
    site: site2
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: personaos-api
