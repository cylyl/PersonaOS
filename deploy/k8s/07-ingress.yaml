apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personaos-ingress
  namespace: personaos
  labels:
    app.kubernetes.io/name: personaos-ingress
    site: site2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: personaos.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: personaos-api
                port:
                  number: 8000
