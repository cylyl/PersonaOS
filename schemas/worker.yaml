# Worker schema — persistent identity.
#
# Per the v0.1 design (Liang, 2026-10-07): Worker is a THIN record.
# It points to external stores (Skills, Memory, Tasks, Events, Runtime).
# All "fat" data — skills, capabilities, permissions, history — lives elsewhere.
#
# Per ADR 0003: Worker is identity. Node is execution location. They are separate.
# Per ADR 0008: six tables only in v0.1; workers is one of them, intentionally lean.

$schema: http://json-schema.org/draft-07/schema#
title: Worker
type: object
additionalProperties: false

required:
  - id
  - name
  - role
  - status
  - runtime
  - max_concurrent_tasks
  - created_at

properties:
  id:
    type: string
    description: Stable worker identifier. Survives model + runtime changes.
    pattern: '^worker-[a-z0-9][a-z0-9-]*[a-z0-9]$'
    examples: ["worker-devops-001", "worker-developer-001", "worker-qa-001"]

  name:
    type: string
    description: Human-readable worker name.
    minLength: 1
    maxLength: 100
    examples: ["DevOps-01", "Senior Developer", "QA Engineer"]

  role:
    type: string
    enum: [devops, developer, qa, architect, security, custom]

  description:
    type: string
    description: One-line role description.
    examples: ["Infrastructure and deployment specialist"]

  status:
    type: string
    description: Worker lifecycle status. Scheduler skips non-idle workers.
    enum: [idle, busy, paused, quarantined, retired]

  runtime:
    type: string
    description: Default runtime adapter (e.g., "openclaw").
    default: openclaw
    examples: ["openclaw"]

  max_concurrent_tasks:
    type: integer
    description: Capacity limit. Scheduler respects this when claiming tasks.
    minimum: 1
    maximum: 16
    default: 1

  capabilities:
    type: array
    description: Tools the worker is allowed to invoke (e.g., "kubectl", "ssh:staging").
    items: { type: string }
    default: []

  permissions:
    type: array
    description: Resource scopes the worker can access (e.g., "staging.read", "production.read").
    items: { type: string }
    default: []

  personality:
    type: object
    description: LLM-independent behavioral config. Survives model changes.
    additionalProperties: false
    properties:
      style: { type: string, examples: ["cautious", "methodical", "thorough"] }
      autonomy: { type: string, enum: [low, medium, high], default: medium }

  memory_id:
    type: string
    description: Reference to the worker's memory entry. Null in v0.1; populated in Phase 2 (per ADR 0007).
    examples: ["memory-worker-devops-001"]

  created_at: { type: string, format: date-time }
  updated_at: { type: string, format: date-time }
  last_seen_at:
    type: string
    format: date-time
    description: Last heartbeat from the worker process.

# Skills are NOT embedded. They live in the worker_skills table.
# See: ADR 0008 — six tables only.
