# Alembic config for PersonaOS v0.1
# Run migrations: .venv/bin/alembic upgrade head
# Create new migration: .venv/bin/alembic revision -m "describe change"
#
# The sqlalchemy.url below is overridden by env.py from
# personaos.config.settings (DATABASE_URL env var).

[alembic]
script_location = src/personaos/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+asyncpg://personaos:personaos@localhost:5432/personaos
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
